name: Bug report
description: Something in DevOS ADE does not work as it should.
title: "[Bug] "
labels: ["feedback", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is PUBLIC. Anyone can read it. Do not include keys, passwords, prompts, file contents, or repository or project names. DevOS ADE only asks for its version, your OS and your Docker Compose version.
  - type: input
    id: version
    attributes:
      label: DevOS ADE version
      description: Shown on Home next to the title.
      placeholder: v0.32.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example macOS 15.1, or Ubuntu 24.04.
    validations:
      required: true
  - type: input
    id: compose
    attributes:
      label: Docker Compose version
      description: Run `docker compose version --short`.
      placeholder: 2.40.3
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps help most. Leave out anything private.
    validations:
      required: true
