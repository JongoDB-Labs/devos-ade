# The optional Code page (./stack code enable; lib/code.sh adds this file to every docker compose call while
# CODE_ENABLED=true and the browser terminal is on — after compose.terminal.yaml, whose sandbox it uses).
#
# The code container serves the page and runs the Agent SDK; Claude Code itself runs in the terminal's sandbox, started
# by bn-coded (terminal/bin/bn-coded.mjs) on a UNIX socket in the code-socket volume — both are the terminal's
# (compose.terminal.yaml), so this file never changes the terminal container. Chat's conversations with your
# subscriptions run in a sandbox of their own (subs-chat, below: the terminal's image without your files). The code container mounts no
# folder of yours and holds no LiteLLM key: files, sessions and plugins are ops of bn-coded, spend and model prices
# come from the portal (/.bn/spend, /.bn/models on the code host). Its network code-link (internal) it shares
# with the main Caddy alone, which asks the portal first (session, a fresh unlock, the Origin) and then adds the secret
# header (CODE_PROXY_SECRET) the code container requires — and through which Open WebUI's connection to your
# subscriptions as Chat models reaches its :8096 (Caddy's internal site :8098, with CODE_CHAT_KEY). It reaches nothing else: not the internet, not LiteLLM, not
# the portal, not the sandbox's network — a Git host sign-in's requests to GitHub or GitLab go through a byte tunnel of
# bn-coded's (the sandbox's own way out), with TLS from end to end in this container. Everything that comes back from the sandbox is treated as untrusted data.
# Its previews of dev servers in the sandbox (caddy/preview-on.caddy; over remote access remote_preview) do not pass
# through the code container: the main Caddy reaches bn-preview in the sandbox through the terminal's gateway (:7682).
services:
  code:
    build:
      context: ./code
    image: ${COMPOSE_PROJECT_NAME:-bedrock-now}/code:local   # per project, like portal
    restart: unless-stopped
    user: "${TERMINAL_UID:-10104}:${TERMINAL_GID:-10104}"   # bn-coded's socket folder is that user's alone (mode 700)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # /run/bn-import-stage: sessions of yours from this computer waiting to be checked and copied into the sandbox (the Import
    # sheet; code/server/import-sessions.mjs) — at most 128 MiB, an hour at most, gone with the container
    tmpfs: ["/tmp:size=64m,mode=1777", "/run/bn-import-stage:size=160m,mode=1777"]
    mem_limit: 1g
    pids_limit: 128
    init: true
    environment:
      # Required on every request (X-Bn-Code-Proxy); only the main Caddy adds it. In the environment only, never on a
      # command line; never in the sandbox.
      CODE_PROXY_SECRET: ${CODE_PROXY_SECRET:-}
      HOME: /tmp
      # Settings › Claude Code › Allow Bypass permissions (only this container enforces it: sessions start allowing the
      # switch, and set_mode accepts it after the page's confirmation). A change recreates this container.
      CODE_ALLOW_BYPASS: ${CODE_ALLOW_BYPASS:-false}
      # Settings › Claude Code › Auto mode (enforced here too: set_mode accepts auto, and sessions are not started with
      # auto mode off). The sandbox's managed settings must allow it as well (compose.terminal.yaml passes it there).
      CODE_AUTO_MODE: ${CODE_AUTO_MODE:-false}
      # Settings › Claude Code › Your AI subscriptions › Use my Claude plan in the Code page and Chat (enforced here: a
      # session or a Chat answer on your plan is started only while it is on; off by default — Anthropic's two texts
      # pull apart, README "Your AI subscriptions"). A change recreates this container.
      CODE_CLAUDE_PLAN: ${CODE_CLAUDE_PLAN:-false}
      # Chat's models on your subscriptions: the key Open WebUI's connection to :8096 carries (through caddy:8098), never on a
      # command line, never in the sandbox
      CODE_CHAT_KEY: ${CODE_CHAT_KEY:-}
      # What the page's Bypass dialog says about the sandbox: its internet access, and the folder of yours it sees (a
      # label only: this container mounts no folder)
      TERMINAL_EGRESS: ${TERMINAL_EGRESS:-}
      CODE_WORKSPACE_LABEL: ${TERMINAL_WORKSPACE:-}
      # Git hosts' Sign in with GitHub / GitLab (code/server/oauth.mjs): the applications' client IDs and the GitHub App's
      # name in its URL — public values, no secret (Settings › Claude Code › More; blank: DevOS ADE's own GitHub App,
      # none for gitlab.com). The device flow's and the renewals' requests go through the sandbox's way out (bn-coded's
      # net.tunnel), TLS here.
      GIT_GITHUB_CLIENT_ID: ${GIT_GITHUB_CLIENT_ID:-}
      GIT_GITHUB_APP_SLUG: ${GIT_GITHUB_APP_SLUG:-}
      GIT_GITLAB_CLIENT_ID: ${GIT_GITLAB_CLIENT_ID:-}
    volumes:
      - code-socket:/run/bn-code:ro   # (the terminal's volume) connecting needs no write access; it never listens there
      - chat-socket:/run/bn-chat:ro   # Chat's sandbox (subs-chat, below): the same, for Chat's conversations
      # Git hosts (the Code page's Git panel; code/server/githosts.mjs): the tokens and SSH keys of the git servers you
      # connect, the host keys you trusted and the last uses — in a folder of mode 700, a file of mode 600. This
      # container's alone: never the sandbox's, never in .env, the portal or a backup (a token is entered again, a key
      # made again, after `docker volume rm`).
      - code-state:/var/lib/bn-code
      # The project folders of this computer (./stack project; lib/projects.sh writes roots.json in it): their ids, names,
      # paths in the sandbox and read-only switches — never a path the sandbox says. The folder, read-only (a new list
      # renamed into it is seen at once); never created by Docker (./stack makes it).
      - type: bind
        source: ${BN_PROJECTS_PUBLIC:?run ./stack up}
        target: /etc/bn-code/projects
        read_only: true
        bind: { create_host_path: false, selinux: z }
    # (one network: Open WebUI's way to Chat's models is the main Caddy's internal site, code-on.caddy :8098 — never a
    # network shared with Open WebUI, which signs in by X-Portal-User from any peer)
    networks:
      code-link:
        aliases: [code-upstream]
    depends_on:
      terminal: { condition: service_healthy }
    logging:   # (YAML anchors do not reach across compose files: same values as x-logging in compose.yaml)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Chat's own sandbox: where your subscriptions answer as Chat models (code/server/chat.mjs). The terminal's image, a
  # home of its own (a tmpfs: nothing of the sandbox's home — no dotfiles, shell files, ~/.config of the terminal's),
  # and sign-ins of its own: each Chat tool's folder a volume of Chat's alone (subs-chat-*: claude-sub's
  # ~/.claude-subscription, ~/.codex, ~/.copilot, ~/.grok), signed in there with the tool's own flow (./stack
  # subscriptions login TOOL --chat) — never the terminal's: nothing either one writes there reaches the other, a
  # config file that would run something included. Writable, as each tool writes there: its login when it renews it,
  # and the sessions a conversation takes up again (Codex's rollouts, Copilot's session state, Grok's sessions,
  # Claude's transcripts). Nothing of your files: no
  # workspace, no project folder, no LiteLLM key, no MCP token, not on the terminal's network (its gateway, LiteLLM
  # and shared-mcp are out of reach). Its one program is bn-coded in Chat's role
  # (terminal/bin/bn-coded.mjs roleOf): Chat's conversations, each in an empty folder of its own
  # (~/.bn-chat/<id>), each tool started with its tools switched off — and nothing else. The code container connects to
  # its socket (chat-socket). Its one network is a way out through an egress proxy, as Settings › Claude Code › Sandbox
  # internet access says: the terminal's proxy (compose.code-proxy.yaml); with the terminal's direct way out, a proxy of
  # its own with the same rules (compose.code-egress.yaml — never this computer's services); or none
  # (compose.code-offline.yaml) — never this stack's default network. Here, a network of its own with nothing else on
  # it and no way out (subs-chat-internal): where it is should a run of compose lack the overlay, which replaces it.
  subs-chat:
    # the terminal's own image, as the terminal's build made it (./stack builds it for the terminal): never built for
    # this service with other arguments, never pulled
    image: ${COMPOSE_PROJECT_NAME:-bedrock-now}/terminal:local
    pull_policy: never
    restart: unless-stopped
    hostname: subs-chat
    user: "${TERMINAL_UID:-10104}:${TERMINAL_GID:-10104}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # its home: its own, gone at each start
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/claude:size=256m,uid=${TERMINAL_UID:-10104},gid=${TERMINAL_GID:-10104},mode=0700
    mem_limit: 2g
    pids_limit: 512
    init: true
    entrypoint: ["node", "/usr/local/bin/bn-coded.mjs"]
    command: []
    networks: [subs-chat-internal]
    environment:
      BN_CODED_ROLE: chat
      BN_CODE_SOCK_DIR: /run/bn-chat
      HOME: /home/claude
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    extra_hosts:   # (as the terminal's: Docker Desktop's names for your computer point nowhere)
      - "host.docker.internal:192.0.2.1"
      - "host.docker.internal:100::1"
      - "gateway.docker.internal:192.0.2.1"
      - "gateway.docker.internal:100::1"
    volumes:
      # Chat's own sign-in folders (never the terminal's), each at its place in this home; never in a backup
      - subs-chat-claude:/home/claude/.claude-subscription
      - subs-chat-codex:/home/claude/.codex
      - subs-chat-copilot:/home/claude/.copilot
      - subs-chat-grok:/home/claude/.grok
      - chat-socket:/run/bn-chat
      # Claude Code's managed settings of Chat's own (terminal/managed/chat.json): every file read denied (an @path of
      # a prompt included), no hook, no Bypass or Auto mode — whatever a conversation's own settings would say
      - type: bind
        source: ./terminal/managed/chat.json
        target: /etc/claude-code/managed-settings.json
        read_only: true
        bind: { create_host_path: false, selinux: z }
    healthcheck:
      test: ["CMD", "test", "-S", "/run/bn-chat/coded.sock"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    depends_on:
      terminal: { condition: service_healthy }   # (its image is the terminal's: built, and the terminal up, first)
    logging:   # (YAML anchors do not reach across compose files: same values as x-logging in compose.yaml)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The main Caddy: the code site (caddy/code-on.caddy, CODE_HOST), proxied to code-upstream:8095.
  caddy:
    networks: [default, terminal-link, code-link]
    environment:
      CODE_MODE: "on"   # caddy/code-on.caddy (code-off.caddy otherwise: no code site)
      CODE_HOST: ${CODE_HOST:-code.${PORTAL_HOST:-bedrock-now.localhost}}
      # the terminal host may be framed by this origin (the Code page's terminal panel; :80 matches the default port)
      CODE_ORIGIN: http://${CODE_HOST:-code.${PORTAL_HOST:-bedrock-now.localhost}}:${PORTAL_PORT:-80}
      # the Code page frames the terminal, previews and the artifact viewer on this port only (its CSP's frame-src)
      PORTAL_PORT: ${PORTAL_PORT:-80}
      CODE_PROXY_SECRET: ${CODE_PROXY_SECRET:-}
      # Remote access (REMOTE_TERMINAL=true and ./stack remote): lib/code.sh writes this name; blank, the remote site's
      # code block matches nothing.
      REMOTE_CODE_HOST: ${REMOTE_CODE_HOST:-code.remote.invalid}
      # Its previews over remote access (remote_preview in caddy/Caddyfile): their one host, written by lib/code.sh while
      # the Code page is remote and REMOTE_PREVIEW is not false; blank, the remote preview block matches nothing.
      REMOTE_PREVIEW_HOST: ${REMOTE_PREVIEW_HOST:-preview.remote.invalid}
      # Its previews of dev servers in the sandbox (caddy/preview-on.caddy; this computer): their own site,
      # p<port>-<capability>.PREVIEW_DOMAIN (lib/code.sh derives it from PORTAL_HOST: bedrock-now-preview.localhost), and
      # the header the terminal's gateway requires before bn-preview (new at every ./stack code enable).
      PREVIEW_MODE: "on"
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-bedrock-now-preview.localhost}
      PREVIEW_PROXY_SECRET: ${PREVIEW_PROXY_SECRET:-}

  # Open WebUI: a second connection besides LiteLLM — your subscriptions as Chat models (the code container's :8096,
  # through the main Caddy's internal site caddy:8098 — code-on.caddy; code/server/chat.mjs). Its model list is the
  # subscriptions signed in for Chat now (none: an empty list).
  open-webui:
    environment:
      OPENAI_API_BASE_URLS: "http://litellm:4000/v1;http://caddy:8098/v1"
      OPENAI_API_KEYS: "${LITELLM_KEY_OPENWEBUI:-};${CODE_CHAT_KEY:-}"

  # The portal: the Code tab, the unlock, the code host's checks, its models and spend (/.bn/models, /.bn/spend), and
  # the previews' links (/.bn/preview) and their checks.
  portal:
    environment:
      CODE_ENABLED: "true"
      CODE_HOST: ${CODE_HOST:-}
      # (Chat's Who answers offers Claude on your plan as a model only while this is on; the code container enforces it)
      CODE_CLAUDE_PLAN: ${CODE_CLAUDE_PLAN:-false}
      # (and none of your subscriptions as a Chat model while the sandbox's way out is the direct one: the code
      # container enforces it, compose.code-egress.yaml)
      TERMINAL_EGRESS: ${TERMINAL_EGRESS:-}
      REMOTE_CODE_HOST: ${REMOTE_CODE_HOST:-}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-bedrock-now-preview.localhost}
      REMOTE_PREVIEW_HOST: ${REMOTE_PREVIEW_HOST:-}
      REMOTE_PREVIEW: ${REMOTE_PREVIEW:-}

networks:
  code-link:
    internal: true
  # Chat's sandbox's alone (subs-chat): nothing else on it, no way out
  subs-chat-internal:
    internal: true

volumes:
  code-state:
  chat-socket:
  subs-chat-claude:
  subs-chat-codex:
  subs-chat-copilot:
  subs-chat-grok:
