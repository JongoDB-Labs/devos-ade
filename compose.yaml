# DevOS ADE stack. All host ports bind to 127.0.0.1. Browsers reach every UI through caddy (the portal);
# only the LiteLLM API and the shared MCP server are published directly, for command-line tools.
# Values come from .env (written by ./stack setup).
# Vars marked :? are created before the first compose call; the :- ones are filled in later setup steps.
name: devos-ade

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./stack setup}
      POSTGRES_DB: litellm
    # Bind mounts carry ",z" so SELinux hosts (Fedora/RHEL) relabel them; it is a no-op elsewhere.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 30
      # (while it starts, checked every second: `up --wait` sees it healthy at once, not at the first interval; so are
      # the other services' checks, here and in the images' HEALTHCHECK)
      start_period: 60s
      start_interval: 1s
    logging: *logging

  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?run ./stack setup}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?run ./stack setup}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - s3data:/data
    # No published port: the console is reached through the portal (files.${PORTAL_HOST}).
    logging: *logging

  # One-shot: waits for RustFS, creates buckets idempotently, exits 0.
  rustfs-init:
    image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
    depends_on: [rustfs]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S3="aws --endpoint-url http://rustfs:9000"
        for i in $$(seq 1 60); do $$S3 s3 ls >/dev/null 2>&1 && break; sleep 2; done
        for b in openwebui shared; do
          $$S3 s3api head-bucket --bucket $$b >/dev/null 2>&1 || $$S3 s3 mb s3://$$b
        done
    logging: *logging

  litellm:
    image: ghcr.io/berriai/litellm:1.106.3@sha256:74d0696a9f0afcc993c7659d246f0c542f003368298633e852228250779f1032
    restart: unless-stopped
    # Directory mount (not a single-file mount): setup replaces config.yaml atomically via mv,
    # which a file bind mount would not follow.
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run ./stack setup}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run ./stack setup}
      UI_USERNAME: admin
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?run ./stack setup}
      # The portal signs you in to the UI (portal/portal/appsso.py); the UI's own Logout then shows its own form
      # (?sso=off: no automatic sign-in there) rather than reloading into a fresh automatic one. (The UI fetches this
      # after the page loads; a Logout before that reloads the page, which the portal sends to the form as well.)
      PROXY_LOGOUT_URL: /ui/login/?sso=off
      # Deletes expired UI session keys (one per sign-in, the portal's included) once a day instead of keeping them.
      LITELLM_EXPIRED_UI_SESSION_KEY_CLEANUP_ENABLED: "true"
      # Models in its database: what lets ./stack change the model list at runtime through LiteLLM's model admin API
      # (master key only), without a restart (lib/litellm_live.sh). config.yaml stays the record: ./stack deletes the
      # rows it adds right after, so a restart reads config.yaml alone.
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"   # no runtime price-map fetch; the config carries our prices (lib/prices.sh)
      # An access key from .env, passed only when set (no value here = taken from .env, else left out). Without
      # one (AWS_AUTH=instance-role on EC2) boto3 finds the instance role through IMDS (hop limit 2; docs/cloud-vm.md).
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}   # budget alerts (soft budget at BUDGET_ALERT_PCT, 100%); empty = none
      # Optional; blank = no OpenRouter models are rendered (lib/openrouter.sh).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # LiteLLM sends these to OpenRouter as X-Title / HTTP-Referer, so OpenRouter's Activity and Logs show the
      # requests as "DevOS ADE" (not "liteLLM"). They name this project only, nothing about you or this install.
      OR_APP_NAME: DevOS ADE
      OR_SITE_URL: https://github.com/JongoDB-Labs/devos-ade
      # Optional; blank = no Experiential Labs models are rendered (lib/explabs.sh). Only LiteLLM holds it.
      EXPLABS_API_KEY: ${EXPLABS_API_KEY:-}
      # Optional speech-to-text provider key (OpenAI or Groq); blank = no "stt" model is rendered (lib/stt.sh).
      STT_API_KEY: ${STT_API_KEY:-}
      # Optional search keys for Claude Code's WebSearch (lib/websearch.sh): the config names the one in use; blank = none.
      WEBSEARCH_TAVILY_API_KEY: ${WEBSEARCH_TAVILY_API_KEY:-}
      WEBSEARCH_BRAVE_API_KEY: ${WEBSEARCH_BRAVE_API_KEY:-}
      WEBSEARCH_PERPLEXITY_API_KEY: ${WEBSEARCH_PERPLEXITY_API_KEY:-}
      # (the checksum of config.yaml and bn_hooks.py, from ./stack: LiteLLM reads them only at start, so a changed file
      # recreates the container, and an unchanged one leaves it running — lib/common.sh config_sums)
      BN_CONFIG_SUM: ${BN_LITELLM_CONFIG_SUM:-}
    volumes:
      - ./litellm:/app/config:ro,z
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    # stt: the speech-to-text container's only network (no internet access); websearch: the built-in SearXNG's (LiteLLM
    # alone reaches it); ollama, llamacpp, vllm: DevOS ADE's own Ollama's, llama.cpp's and vLLM's, on Linux (LiteLLM alone
    # reaches them)
    networks: [default, stt, websearch, ollama, llamacpp, vllm]
    # Local models (lib/local_models.sh): a model runner on this computer — Docker Model Runner's TCP port or a host
    # Ollama — is host.docker.internal. Docker Desktop names it already (this maps it to the same host); Docker Engine
    # on Linux needs the line.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 1s
    logging: *logging

  open-webui:
    # Open WebUI as pinned (the base below), with the Python runner's packages vendored into it (open-webui/: Chat's
    # page reaches only Open WebUI itself) — built here, never pulled (no registry image can take its name); ./stack
    # setup, update and up build it
    build:
      context: ./open-webui
      args:
        # the pinned Open WebUI, by digest: its pyodide-lock.json pins every vendored wheel (open-webui/Dockerfile's
        # default is the same: tests/test_openwebui.sh)
        image: ghcr.io/open-webui/open-webui:v0.12.4-slim@sha256:41812075aede8ada8497cb2b71c76412978633eee72775bb77796f593d03b677
    image: ${COMPOSE_PROJECT_NAME:-devos-ade}/open-webui:local   # per project, like portal
    pull_policy: never
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?run ./stack setup}
      WEBUI_ADMIN_EMAIL: ${OPENWEBUI_ADMIN_EMAIL:?run ./stack setup}
      WEBUI_ADMIN_PASSWORD: ${OPENWEBUI_ADMIN_PASSWORD:?run ./stack setup}
      WEBUI_ADMIN_NAME: Admin
      ENABLE_SIGNUP: "false"
      ENABLE_PERSISTENT_CONFIG: "false"   # .env always wins over values saved in the DB
      ENABLE_API_KEYS: "true"
      ENABLE_OLLAMA_API: "false"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      VECTOR_DB: pgvector
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_BUCKET_NAME: openwebui
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_REGION_NAME: us-east-1
      S3_ADDRESSING_STYLE: path
      RAG_EMBEDDING_ENGINE: ${OWUI_EMBED_ENGINE:-openai}   # never the local sentence-transformers default
      ENABLE_WEB_SEARCH: "false"                            # no third-party search APIs
      ENABLE_OPENAI_API: "true"                             # only connection = LiteLLM
      RAG_EMBEDDING_MODEL: ${OWUI_EMBED_MODEL:-}
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      ENABLE_RAG_HYBRID_SEARCH: ${OWUI_HYBRID_SEARCH:-false}
      RAG_RERANKING_ENGINE: ${OWUI_RERANK_ENGINE:-}
      RAG_RERANKING_MODEL: ${OWUI_RERANK_MODEL:-}
      RAG_EXTERNAL_RERANKER_URL: http://litellm:4000/v1/rerank
      RAG_EXTERNAL_RERANKER_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      ENABLE_IMAGE_GENERATION: ${OWUI_ENABLE_IMAGES:-false}
      IMAGE_GENERATION_ENGINE: openai
      IMAGES_OPENAI_API_BASE_URL: http://litellm:4000/v1
      IMAGES_OPENAI_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      IMAGE_GENERATION_MODEL: ${OWUI_IMAGE_MODEL:-}
      # Chat experience (OWUI_* model choices are made by setup from the models your key can use)
      DEFAULT_MODELS: ${OWUI_DEFAULT_MODEL:-}                # default chat model for users without their own
      TASK_MODEL_EXTERNAL: ${OWUI_TASK_MODEL:-}              # titles, tags, follow-ups: the pinned model, else each chat's own
      ENABLE_TITLE_GENERATION: "true"
      ENABLE_TAGS_GENERATION: "true"
      ENABLE_FOLLOW_UP_GENERATION: "true"
      # usage: token usage per answer (the cost filter needs it). builtinTools: v0.12 sends the specs of ~40
      # built-in tools (knowledge bases, chat history, notes, calendar, automations, skills, tasks, time…)
      # with EVERY chat request — ~8-10K input tokens for a one-line question. Those categories are off, and
      # so are the 8 memory tools (~2K tokens; the browser turns Memory on in every chat): saved memories still
      # reach the model as context, it just can't edit them itself. Image generation, code interpreter, web
      # search and attached-file tools stay on (each is sent only while the user turns that feature on in the
      # chat). Attachments and #knowledge still use RAG. A model's own Builtin Tools settings (Workspace →
      # Models) override this. README: Costs.
      DEFAULT_MODEL_METADATA: >-
        {"capabilities":{"usage":true},"builtinTools":{"time":false,"user_input":false,"knowledge":false,
        "chats":false,"notes":false,"channels":false,"skills":false,"tasks":false,"automations":false,
        "calendar":false,"notifications":false,"subagents":false,"memory":false}}
      ENABLE_VERSION_UPDATE_CHECK: "false"
      # No changelog popup / update toast; read-aloud uses the browser's system voices. The microphone follows
      # AUDIO_STT_ENGINE (no per-user STT default, so turning server speech-to-text on reaches every user).
      # detectArtifacts off: an answer's html code block opens in the Artifacts panel (a sandbox that runs its
      # scripts) only when you click its Preview, never by itself — each user can turn it back on (Settings ›
      # Interface).
      DEFAULT_INTERFACE_SETTINGS: '{"showChangelog":false,"showUpdateToast":false,"detectArtifacts":false,"audio":{"tts":{"engine":""}}}'
      # The policy Open WebUI writes into an artifact's own document (and a citation's or a file's preview): the Code
      # page's artifact viewer's (caddy/artifact-on.caddy, its HTML runner — tests/test_portal.sh keeps the two the
      # same): its own scripts and styles run, nothing reaches the network (connect-src 'none'), no form, frame or
      # plugin. (Without the runner's sandbox and frame-ancestors, which a policy in a document cannot set: Open WebUI's
      # frame is sandboxed itself, and Chat's own policy — Caddyfile chat_csp — applies to it as well.)
      IFRAME_CSP: "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: data:; style-src 'unsafe-inline' data: blob:; img-src data: blob:; font-src data: blob:; media-src data: blob:; connect-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'; webrtc 'block'"
      # Speech-to-text: "web" = the browser's Web Speech API (the slim image has no local Whisper; Call is then
      # unavailable). "openai" (OWUI_STT_ENGINE, set by ./stack setup / ./stack stt) = an OpenAI-compatible server
      # called with Open WebUI's own key, so it counts on that key's budget (lib/stt.sh): the stt container for
      # Bedrock Voxtral, through Caddy's internal :8090 site (OWUI_STT_BASE_URL; Open WebUI shares no network with
      # stt), else LiteLLM's "stt" model (OpenAI or Groq).
      AUDIO_STT_ENGINE: ${OWUI_STT_ENGINE:-web}
      AUDIO_STT_OPENAI_API_BASE_URL: ${OWUI_STT_BASE_URL:-http://litellm:4000/v1}
      AUDIO_STT_OPENAI_API_KEY: ${LITELLM_KEY_OPENWEBUI:-}
      AUDIO_STT_MODEL: stt
      AUDIO_TTS_ENGINE: ""                                   # "" = browser voices (Call reads answers with them too)
      DEFAULT_PROMPT_SUGGESTIONS: '[{"title":["Summarize a document","attach a file and get the key points"],"content":"Summarize the attached document: the key points first, then anything that needs a decision or follow-up."},{"title":["Explain this code","paste a snippet"],"content":"Explain what this code does, step by step, and point out anything risky or surprising:\n\n"},{"title":["Draft an email","from a few bullet points"],"content":"Draft a short, friendly, professional email from these points:\n- "},{"title":["Compare two options","pros, cons and a recommendation"],"content":"Compare these two options. Give pros and cons of each in a table, then a recommendation with the main reason:\nOption A: \nOption B: "}]'
      ENABLE_COMMUNITY_SHARING: "false"                     # no sharing to openwebui.com
      OFFLINE_MODE: "true"                                  # no Hugging Face downloads, no update check
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      # Login comes from the portal: Caddy deletes any client-sent X-Portal-User and sets it only for a valid
      # portal session. Safe only because Open WebUI publishes no port (reachable through Caddy alone).
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Portal-User
      # Remote access (./stack remote): links built for the remote name (empty = Open WebUI's default). Its cookies
      # stay non-Secure here (the local site is http); Caddy's remote site marks them Secure on the way out.
      WEBUI_URL: ${REMOTE_CHAT_HOST:+https://${REMOTE_CHAT_HOST:-}}
      # Cross-origin requests (and its WebSocket) only from Chat's own origins: CHAT_ORIGIN (./stack writes it like
      # PORTAL_ORIGIN) and the remote chat host. Open WebUI's default, '*', answers any Origin with credentials
      # allowed: a page on the portal's other hosts (the terminal's included) could read your chats. '*' only
      # until ./stack up has written CHAT_ORIGIN.
      CORS_ALLOW_ORIGIN: "${CHAT_ORIGIN:-*}${CHAT_ORIGIN:+${REMOTE_CHAT_HOST:+;https://${REMOTE_CHAT_HOST:-}}}"
    volumes:
      - owui:/app/backend/data
    depends_on:
      postgres: { condition: service_healthy }
      litellm: { condition: service_healthy }
      rustfs-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
      start_interval: 2s
    logging: *logging

  shared-mcp:
    build: { context: ./shared-mcp, target: runtime }
    image: ${COMPOSE_PROJECT_NAME:-devos-ade}/shared-mcp:local   # per project: a second copy never clobbers it
    restart: unless-stopped
    environment:
      SHARED_MCP_TOKEN: ${SHARED_MCP_TOKEN:?run ./stack setup}
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      SHARED_BUCKET: shared
      OPENWEBUI_URL: http://open-webui:8080
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
    ports:
      - "127.0.0.1:${SHARED_MCP_PORT:-8765}:8000"
    depends_on:
      open-webui: { condition: service_healthy }
      rustfs-init: { condition: service_completed_successfully }
    logging: *logging

  # Bedrock speech-to-text (lib/stt.sh; only with STT_PROVIDER=bedrock: ./stack adds --profile stt). Open WebUI posts
  # recordings here (through Caddy's internal :8090 site); ffmpeg converts them and Mistral Voxtral transcribes
  # them through LiteLLM's Bedrock pass-through with the caller's own key. No AWS credentials, no key of its own,
  # no published port.
  stt:
    build: { context: ./stt, target: runtime }
    image: ${COMPOSE_PROJECT_NAME:-devos-ade}/stt:local   # per project, like portal
    profiles: ["stt"]
    restart: unless-stopped
    user: "10103:10103"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Uploads and ffmpeg's work files: per request up to 25 MB spooled + 25 MB input + 2.4 MB MP3; three at a time.
    tmpfs: ["/tmp:size=192m,mode=1777"]
    mem_limit: 768m
    pids_limit: 64
    # Only the internal "stt" network, with LiteLLM and Caddy: no internet access, and no way to reach Open WebUI
    # (which trusts X-Portal-User from its peers) or the portal. Open WebUI and the portal reach it through Caddy's
    # internal :8090 site, which strips X-Portal-* — a one-way hop.
    networks: [stt]
    environment:
      LITELLM_URL: http://litellm:4000
      STT_BEDROCK_MODEL: ${STT_BEDROCK_MODEL:-voxtral-small}
    depends_on:
      litellm: { condition: service_healthy }
    logging: *logging

  # The built-in web search for Claude Code's WebSearch (lib/websearch.sh: the default backend while you set up no other;
  # the "searxng" profile, which ./stack turns on unless WEBSEARCH_SEARXNG_BUILTIN=off — off, no container). SearXNG, the
  # official image pinned by digest, with settings.yml rendered by ./stack (searxng/, read-only: the engines it asks,
  # JSON output, no limiter, no image proxy). No published port, no Caddy route: its one inbound network, "websearch"
  # (internal), it shares with LiteLLM alone — never the portal, Open WebUI, the terminal, the Code page or their
  # sandboxes. Its way out to the search engines is "websearch-out", a network of its own with nothing else on it (the
  # internet, as LiteLLM's default network has it; docs/security.md says why not an egress proxy). Only search queries
  # reach it, from LiteLLM; it holds no key of yours. Its secret (SearXNG's server.secret_key) is .env's
  # WEBSEARCH_SEARXNG_SECRET, in its environment only: without one, SearXNG's own placeholder, which it refuses to start
  # with.
  searxng:
    image: searxng/searxng:2026.10.24-ef0ec03da@sha256:7c7cbe509429e82755104b2a95f52085a98633c95d53f44e4e905fa3a59f08c8
    profiles: ["searxng"]
    restart: unless-stopped
    user: "977:977"   # the image's searxng user (its entrypoint would otherwise run as root)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # What it writes: its cache (owned by its user) and Python's temporary files
    tmpfs: ["/var/cache/searxng:size=32m,uid=977,gid=977,mode=0700", "/tmp:size=32m,mode=1777"]
    mem_limit: 512m
    pids_limit: 128
    environment:
      SEARXNG_SECRET: ${WEBSEARCH_SEARXNG_SECRET:-ultrasecretkey}
      # (the checksum of searxng/settings.yml, from ./stack: a changed file recreates the container)
      BN_SETTINGS_SUM: ${BN_SEARXNG_SETTINGS_SUM:-}
    # Directory mount, read-only (like LiteLLM's: a file replaced by ./stack is seen at the next start)
    volumes:
      - ./searxng:/etc/searxng:ro,z
    # Docker Desktop's names for your computer point nowhere in here (as in the terminal's sandbox)
    extra_hosts:   # IPv4 TEST-NET and the IPv6 discard prefix: nothing answers there
      - "host.docker.internal:192.0.2.1"
      - "host.docker.internal:100::1"
      - "gateway.docker.internal:192.0.2.1"
      - "gateway.docker.internal:100::1"
    networks: [websearch, websearch-out]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 1s
    logging: *logging

  # The built-in local git server (lib/localgit.sh; the "forgejo" profile, which ./stack turns on unless LOCALGIT=off — off,
  # no container). Forgejo (the community fork of Gitea), rootless, pinned by digest: repositories, branches and pull
  # requests on this computer, with a web UI at git.PORTAL_HOST (Caddy: caddy/localgit-on.caddy) and the sandbox's git over
  # the terminal gateway's TLS listener (caddy/localgit-gateway-on.caddy, compose.localgit.yaml) — never over the internet.
  # SQLite, no SSH server, no registration, no mail, no Actions: one small container (about 110 MB at rest). Its one
  # network, "localgit" (internal: no way out to the internet — a mirror's way out is added only while one is set up),
  # it shares with Caddy and the terminal's gateway alone. Everything it keeps — repositories, the database, its own
  # secrets (app.ini, made at its first start) — is the gitdata volume. The settings are the environment's (Forgejo reads
  # its FORGEJO__<section>__<name> variables at each start); the owner's account is made by ./stack (lib/localgit.sh), its password .env's
  # LOCALGIT_ADMIN_PASSWORD.
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1-rootless@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3
    profiles: ["forgejo"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=256m,uid=1000,gid=1000,mode=1777"]
    mem_limit: 768m
    pids_limit: 256
    environment:
      GITEA_APP_INI: /var/lib/gitea/app.ini
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: ${GIT_ORIGIN:-http://git.devos-ade.localhost}/
      FORGEJO__server__DOMAIN: ${GIT_HOST:-git.devos-ade.localhost}
      FORGEJO__server__DISABLE_SSH: "true"          # git over https only (the sandbox's; ./stack's Code page host)
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__server__OFFLINE_MODE: "true"         # no gravatar, no CDN
      FORGEJO__picture__DISABLE_GRAVATAR: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      # The portal signs the owner in (caddy/localgit-on.caddy): after its session check Caddy sets a header — named by a secret of
      # ./stack's, LOCALGIT_SSO_HEADER (X-Bn-Git-<32 hex>, in .env, known to Caddy and Forgejo alone) — to the owner's account, on
      # that site's path only. Forgejo takes that header from ANY peer on the internal "localgit" network (its trusted-proxy
      # setting does not limit it: tests/e2e/localgit proves it), so the control is that nobody else can name it: the
      # terminal's gateway and Caddy's :8099 site never see the name, and also remove the plain X-Webauth-* names. No
      # registration from it; it never signs in the API or git.
      # Fails closed: it is on only while ./stack has made the secret name (dc() in lib/common.sh sets LOCALGIT_SSO_ON to true
      # only with a non-empty LOCALGIT_SSO_HEADER); with none, the sign-in is off and there is no name to guess.
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: ${LOCALGIT_SSO_ON:-false}
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "false"
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION_API: "false"
      FORGEJO__security__REVERSE_PROXY_AUTHENTICATION_USER: ${LOCALGIT_SSO_HEADER:-}
      # Second layer: Forgejo takes X-Forwarded-For only from Caddy's fixed address (it does not limit the sign-in header itself:
      # the secret name above does that), one hop.
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 10.255.255.238/32
      FORGEJO__security__REVERSE_PROXY_LIMIT: "1"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"   # a push to a missing repository of the owner makes it (private): the Code page's Publish
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__federation__ENABLED: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__other__SHOW_FOOTER_VERSION: "false"
      # Mirroring (lib/localgit.sh): the only host names it may reach — .env's record of the mirrors there are; blank with none
      # (and then Forgejo has no way out at all: compose.localgit-mirror.yaml gives it one while a mirror exists). Its own refusal of
      # private, loopback and link-local addresses stays on.
      FORGEJO__migrations__ALLOWED_DOMAINS: ${LOCALGIT_MIRROR_HOSTS:-}
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "false"
      FORGEJO__log__LEVEL: Warn
    volumes:
      - gitdata:/var/lib/gitea
    networks: [localgit]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 1s
    logging: *logging

  # Login, Home dashboard, and the auth check Caddy asks before every request (/auth/verify).
  portal:
    # (+ compose.portal-docs.yaml, which ./stack adds where Docker Compose reads it: the search's docs index)
    build: { context: ./portal, target: runtime }
    image: ${COMPOSE_PROJECT_NAME:-devos-ade}/portal:local   # per project, like shared-mcp
    restart: unless-stopped
    # User 10102 owns /state (portal-state). Linux: PORTAL_GID (set by ./stack) is your group, so the price
    # update can write litellm/prices/ (setgid, group-writable); macOS needs no group.
    user: "10102:${PORTAL_GID:-10102}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      PORTAL_STATE_DIR: /state
      # Not :? — ./stack update pulls images before setup has created these; the portal refuses to start without them.
      # The hash of PORTAL_PASSWORD (./stack keeps it in step): the portal never holds the password itself.
      PORTAL_PASSWORD_HASH: ${PORTAL_PASSWORD_HASH:-}
      PORTAL_SECRET: ${PORTAL_SECRET:-}
      # Caddy sends it on every request it forwards; without it the portal ignores X-Portal-Remote and
      # Tailscale-User-Login (they could only come from another container talking to portal:8000 directly).
      PORTAL_PROXY_SECRET: ${PORTAL_PROXY_SECRET:-}
      PORTAL_HOST: ${PORTAL_HOST:-devos-ade.localhost}
      PORTAL_PORT: ${PORTAL_PORT:-80}
      # Where the password lives, for the login page (set by ./stack; blank = the generic wording).
      PORTAL_ENV_FILE: ${DEVOS_ADE_ENV_DISPLAY:-}
      PORTAL_PROJECT: ${COMPOSE_PROJECT_NAME:-}
      PORTAL_USER_EMAIL: ${OPENWEBUI_ADMIN_EMAIL:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_KEY_CLAUDE_CODE: ${LITELLM_KEY_CLAUDE_CODE:-}
      LITELLM_KEY_OPENWEBUI: ${LITELLM_KEY_OPENWEBUI:-}
      LITELLM_KEY_SETUP: ${LITELLM_KEY_SETUP:-}
      LITELLM_UI_USER: ${LITELLM_UI_USER:-admin}   # the admin email once setup created LiteLLM's database admin
      LITELLM_UI_PASSWORD: ${LITELLM_UI_PASSWORD:-}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      # Settings → Files shows it behind the password (the portal already holds the RustFS root pair it guards).
      SHARED_MCP_TOKEN: ${SHARED_MCP_TOKEN:-}
      CLAUDE_BEDROCK_OPUS_MODEL: ${CLAUDE_BEDROCK_OPUS_MODEL:-}
      CLAUDE_BEDROCK_SONNET_MODEL: ${CLAUDE_BEDROCK_SONNET_MODEL:-}
      CLAUDE_BEDROCK_HAIKU_MODEL: ${CLAUDE_BEDROCK_HAIKU_MODEL:-}
      # Voice on Home: which speech-to-text is on (lib/stt.sh keeps these in step; no key is passed).
      STT_ENGINE: ${OWUI_STT_ENGINE:-web}
      STT_PROVIDER: ${STT_PROVIDER:-}
      STT_MODEL: ${STT_MODEL:-}
      STT_BEDROCK_MODEL: ${STT_BEDROCK_MODEL:-}
      # Optional: Home asks openrouter.ai for the key's usage/credits server-side; never sent to the browser.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # PORTAL_SESSION_DAYS: how long a sign-in lasts; BUDGET_ALERT_PCT: where the budget meters on Home turn amber
      PORTAL_SESSION_DAYS: ${PORTAL_SESSION_DAYS:-30}
      BUDGET_ALERT_PCT: ${BUDGET_ALERT_PCT:-80}
      # Daily price update from public price lists (no credentials); the region picks the regional AWS prices.
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      PRICE_UPDATES: ${PRICE_UPDATES:-true}
      # Daily check for a newer DevOS ADE release (GitHub's public releases API; nothing about you is sent).
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      # One-click Update/Rollback/Clean from a remote (non-localhost) browser: off unless set to true.
      REMOTE_ADMIN_ACTIONS: ${REMOTE_ADMIN_ACTIONS:-false}
      # App host names (blank = chat./admin./files.PORTAL_HOST) and the remote site (./stack remote; blank = off).
      CHAT_HOST: ${CHAT_HOST:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
      FILES_HOST: ${FILES_HOST:-}
      REMOTE_MODE: ${REMOTE_MODE:-off}
      REMOTE_HOST: ${REMOTE_HOST:-}
      REMOTE_CHAT_HOST: ${REMOTE_CHAT_HOST:-}
      REMOTE_ADMIN_HOST: ${REMOTE_ADMIN_HOST:-}
      REMOTE_FILES_HOST: ${REMOTE_FILES_HOST:-}
      TAILSCALE_ALLOWED_LOGIN: ${TAILSCALE_ALLOWED_LOGIN:-}
    # Read-only: model check results (probe-results.tsv), the rendered config and the catalog for Home, and
    # .state/status (the installed version, written by ./stack). Writable besides /tmp: portal-state (/state:
    # the logout time, so a restart keeps it), litellm/prices/ (only prices.auto.tsv + prices.meta.json from the
    # daily price update), .state/update-check (only the release check's latest.json + latest.txt) and
    # .state/requests (only req-/act-<nonce>.json and cfg-<nonce>.req files for the optional host helper,
    # lib/helper.sh and lib/settings_helper.sh). No Docker socket, no .env: Settings reads .state/status/settings.json.
    volumes:
      - ./litellm:/data/litellm:ro,z
      - ./litellm/prices:/data/prices:rw,z
      - ./catalog:/data/catalog:ro,z
      - ./.state/status:/data/status:ro,z
      - ./.state/update-check:/data/update-check:rw,z
      - ./.state/requests:/data/requests:rw,z
      - portal-state:/state
    logging: *logging

  # The only way in for browsers: http://${PORTAL_HOST} and its chat./admin./files. subdomains (caddy/Caddyfile).
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    user: "65534:65534"          # unprivileged: listens on 8080 inside the container
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # the image's caddy binary carries this file capability; exec fails without it
    security_opt: ["no-new-privileges:true"]
    # Owned by the unprivileged user: Caddy creates /data/caddy and /config/caddy at start.
    tmpfs: ["/data:uid=65534,gid=65534,mode=0700", "/config:uid=65534,gid=65534,mode=0700"]
    environment:
      PORTAL_HOST: ${PORTAL_HOST:-devos-ade.localhost}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-http://devos-ade.localhost}   # written by setup: http://HOST[:PORT]
      CHAT_HOST: ${CHAT_HOST:-chat.${PORTAL_HOST:-devos-ade.localhost}}
      ADMIN_HOST: ${ADMIN_HOST:-admin.${PORTAL_HOST:-devos-ade.localhost}}
      FILES_HOST: ${FILES_HOST:-files.${PORTAL_HOST:-devos-ade.localhost}}
      # The built-in git server's site (caddy/localgit-on.caddy; lib/localgit.sh: BN_LOCALGIT_MODE is on while LOCALGIT is)
      GIT_HOST: ${GIT_HOST:-git.${PORTAL_HOST:-devos-ade.localhost}}
      LOCALGIT_MODE: ${BN_LOCALGIT_MODE:-off}
      LOCALGIT_SSO_HEADER: ${LOCALGIT_SSO_HEADER:-}   # the name of the sign-in header Forgejo takes (a secret of ./stack's)
      CADDY_AUTO_HTTPS: "off"   # compose.domain.yaml: disable_redirects (certificates for the remote site)
      # Remote site (caddy/remote-<mode>.caddy; ./stack remote). The .invalid names only keep the file valid
      # while the sidecar has not told us the tailnet's name yet: nothing can match them.
      REMOTE_MODE: ${REMOTE_MODE:-off}
      REMOTE_HOST: ${REMOTE_HOST:-remote.invalid}
      REMOTE_CHAT_HOST: ${REMOTE_CHAT_HOST:-chat.remote.invalid}
      REMOTE_ADMIN_HOST: ${REMOTE_ADMIN_HOST:-admin.remote.invalid}
      REMOTE_FILES_HOST: ${REMOTE_FILES_HOST:-files.remote.invalid}
      REMOTE_ORIGIN: ${REMOTE_ORIGIN:-https://remote.invalid}
      # Only the sidecar's fixed address may use the remote listeners (compose.tailscale.yaml).
      REMOTE_SIDECAR_IP: ${REMOTE_SIDECAR_IP:-10.255.255.254}
      PORTAL_PROXY_SECRET: ${PORTAL_PROXY_SECRET:-}
      # (the checksum of the Caddyfile and the *.caddy it imports, from ./stack: with its admin API off, Caddy reads them
      # only at start, so a changed file recreates the container — lib/common.sh config_sums)
      BN_CONFIG_SUM: ${BN_CADDY_CONFIG_SUM:-}
    depends_on:
      portal: { condition: service_healthy }   # forward_auth needs it; avoids 502s on the first requests
    # Directory mount, so a Caddyfile replaced by git (new inode) is seen after a restart.
    volumes:
      - ./caddy:/etc/caddy:ro,z
    ports:
      - "127.0.0.1:${PORTAL_PORT:-80}:8080"   # only 8080: the internal :8090 site (speech-to-text) is not published
    networks:
      default:
      stt:
      localgit:
        ipv4_address: 10.255.255.238   # fixed: Forgejo's trusted proxy (REVERSE_PROXY_TRUSTED_PROXIES)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/caddy-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 1s
    logging: *logging

  # Ollama, a local-model runtime DevOS ADE installs and runs itself (lib/runtimes.sh: Settings › Models & providers ›
  # Local models › Runtimes, ./stack runtimes install ollama). This container is its Linux form: in the "ollama" profile,
  # only while it is installed (on a Mac it runs natively instead, for Metal). The model gateway reaches it as
  # ollama:11434 on "ollama" (internal: LiteLLM and Ollama only); "ollama-out" is its way to Hugging Face, shared with
  # its gate alone. Nothing publishes it: ./stack's downloads, and your own tools, reach it through ollama-gate on
  # 127.0.0.1:11434. Its models are the ollama-models volume. compose.ollama-gpu.yaml adds the NVIDIA GPUs. Cloud
  # features off; nothing is pulled but what ./stack local-models pull asks for (from Hugging Face).
  ollama:
    image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    profiles: ["ollama"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    environment:
      # (all of the container's addresses: its two networks. Ollama checks a request's Host only when it listens on
      # loopback, so here ollama-gate does: caddy/ollama-gate.caddy)
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-models:/root/.ollama
    networks: [ollama, ollama-out]
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 2s
    logging: *logging

  # The one way to DevOS ADE's Ollama from this computer, on Linux (caddy/ollama-gate.caddy; the same pinned image as the
  # main Caddy; in the "ollama" profile with it): 127.0.0.1:11434, as a native Ollama listens. Only a request named for
  # loopback (127.0.0.1, localhost) goes on to Ollama; any other name — a web page that pointed a name of its own at
  # 127.0.0.1 (DNS rebinding) — is 403, the check Ollama itself makes only when it listens on loopback.
  ollama-gate:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    profiles: ["ollama"]
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/ollama-gate.caddy", "--adapter", "caddyfile"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # the image's caddy binary carries this file capability; exec fails without it
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/data:uid=65534,gid=65534,mode=0700", "/config:uid=65534,gid=65534,mode=0700"]
    mem_limit: 128m
    pids_limit: 100
    environment:
      # (the checksum of caddy/ollama-gate.caddy, from ./stack: read only at start, so a changed file recreates the
      # container — lib/common.sh config_sums)
      BN_CONFIG_SUM: ${BN_OLLAMA_GATE_CONFIG_SUM:-}
    # Directory mount, like the main Caddy's (a file replaced by git is seen after a restart).
    volumes:
      - ./caddy:/etc/caddy:ro,z
    ports:
      - "127.0.0.1:11434:11434"
    networks: [ollama-out]
    depends_on:
      ollama: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:11435/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 1s
    logging: *logging

  # DevOS ADE's own llama.cpp, on Linux (lib/runtimes.sh; in the "llamacpp" profile while it is installed): llama-server in
  # router mode — the models downloaded in Settings › Local models (read-only, checked against the Hub's hashes when they
  # arrived) and its settings, presets.ini and its API key, mounted read-only from .state/runtimes/llamacpp. On an
  # internal network with the model gateway alone: it publishes nothing and reaches nothing (it downloads nothing itself).
  # Every request but /health needs its key. It runs as you (BN_LLAMACPP_USER: rootless Docker's root is you), read-only,
  # with no capabilities. compose.llamacpp-gpu.yaml swaps in the CUDA image when Docker had the NVIDIA runtime at install.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-b11960@sha256:8052c13edd987de8858f8150031e025ac3d66823f09cf3ec8220899c4abce220
    profiles: ["llamacpp"]
    restart: unless-stopped
    user: "${BN_LLAMACPP_USER:-65534:65534}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 2048
    tmpfs: [/tmp]
    environment:
      HOME: /tmp
      LLAMA_CACHE: /tmp/cache
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
    command: ["--models-preset", "/etc/llamacpp/presets.ini", "--api-key-file", "/etc/llamacpp/api-key", "--no-ui",
              "--cors-origins", "localhost", "--models-max", "2", "--models-memory-margin", "1024"]
    volumes:
      - ${BN_LLAMACPP_DIR:-./.state/runtimes/llamacpp}/hub:/models:ro,z
      - ${BN_LLAMACPP_DIR:-./.state/runtimes/llamacpp}/etc:/etc/llamacpp:ro,z
    networks: [llamacpp]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 2s
    logging: *logging

  # DevOS ADE's own vLLM, on Linux only (lib/runtimes.sh; in the "vllm" profile while it is installed and has a model to
  # serve): one model at a time, the one Settings › Local models last sent to it — /models/current, a link to its
  # snapshot (safetensors weights, read-only, checked against the Hub's hashes when they arrived) — with etc/serve.yaml
  # (its name, context, tool-call parser and API key: every /v1 request needs it). On an internal network with the model
  # gateway alone: it publishes nothing and reaches nothing (offline: it downloads nothing itself, and never runs a
  # model's own code). It runs as you (BN_VLLM_USER), read-only but for its compile cache (cache/) and /tmp, with no
  # capabilities. /tmp allows exec: at its start vLLM compiles its kernels there (Triton) and loads them, which a noexec
  # /tmp (Docker's default) refuses ("failed to map segment from shared object"). This is the CPU build (x86-64 with AVX2 or AVX-512); compose.vllm-gpu.yaml swaps in the NVIDIA one when
  # Docker had the NVIDIA runtime at install.
  vllm:
    image: vllm/vllm-openai-cpu:v0.32.0-x86_64@sha256:827ef38187f9b52f2bb838695ef815ec5b65f4bf3e4c061b002b2b0a19cb0701
    profiles: ["vllm"]
    restart: unless-stopped
    user: "${BN_VLLM_USER:-65534:65534}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    shm_size: 4gb
    tmpfs: ["/tmp:exec,size=2g,mode=1777"]
    environment:
      HOME: /cache
      USER: devos            # (who Python's getpass says it is: this user has no passwd entry in the image)
      LOGNAME: devos
      XDG_CACHE_HOME: /cache
      VLLM_CACHE_ROOT: /cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /cache/inductor
      TRITON_CACHE_DIR: /cache/triton
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      VLLM_CPU_KVCACHE_SPACE: "4"          # (the CPU build: GiB for the KV cache)
      VLLM_CPU_OMP_THREADS_BIND: nobind    # (no NUMA binding: it would need CAP_SYS_NICE and an open seccomp profile)
    entrypoint: ["vllm", "serve"]
    command: ["/models/current", "--config", "/etc/vllm/serve.yaml"]
    volumes:
      - ${BN_VLLM_DIR:-./.state/runtimes/vllm}/hub:/models:ro,z
      - ${BN_VLLM_DIR:-./.state/runtimes/vllm}/etc:/etc/vllm:ro,z
      - ${BN_VLLM_DIR:-./.state/runtimes/vllm}/cache:/cache:z
    networks: [vllm]
    # (/health answers once the model is loaded; loading one on a CPU takes minutes)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30m
      start_interval: 5s
    logging: *logging

networks:
  default:
  # Speech-to-text (lib/stt.sh): internal (no internet access); its members are stt, LiteLLM and Caddy only.
  stt:
    internal: true
  # The built-in SearXNG (lib/websearch.sh): internal; its members are LiteLLM and SearXNG only.
  websearch:
    internal: true
  # Its way out to the search engines: SearXNG alone on it.
  websearch-out:
  # DevOS ADE's own Ollama, on Linux (lib/runtimes.sh): internal; its members are LiteLLM and Ollama only.
  ollama:
    internal: true
  # Its way out to Hugging Face (its pulls), and its gate's way to it (ollama-gate publishes 127.0.0.1:11434): Ollama and
  # ollama-gate only.
  ollama-out:
  # DevOS ADE's own llama.cpp, on Linux (lib/runtimes.sh): internal; its members are LiteLLM and llama.cpp only.
  llamacpp:
    internal: true
  # DevOS ADE's own vLLM, on Linux (lib/runtimes.sh): internal; its members are LiteLLM and vLLM only.
  vllm:
    internal: true
  # The built-in git server (lib/localgit.sh): internal; its members are Forgejo, Caddy and (compose.localgit.yaml) the
  # terminal's gateway only.
  localgit:
    internal: true
    ipam:
      config:
        - subnet: 10.255.255.224/28   # outside Docker's default pools (like the Tailscale sidecar's); Caddy is .238

volumes:
  pgdata:
  s3data:
  owui:
  portal-state:
  gitdata:
  ollama-models:
