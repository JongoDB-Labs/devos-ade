# llama.cpp's container with this computer's NVIDIA GPUs (lib/runtimes.sh runtime_overlays: added while llama.cpp is
# installed here and Docker had the NVIDIA runtime when it was installed): the same build's CUDA image, pinned by digest.
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11960@sha256:4ccae195bf542f7844301ae06891baa32a7551cb16de8428af6e929403d4292c
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
