<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in · DevOS ADE</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/app-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/app-touch-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DevOS ADE">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/login.css">
<script src="/static/login.js" defer></script>
</head>
<body class="login">
<main class="login-panel">
  <div class="brand"><img src="/static/logo.svg" alt="" width="36" height="36"><span>DevOS ADE</span></div>
  <h1>Sign in</h1>
  <p class="lede">One password for all of DevOS ADE on this computer: Home, Chat, Admin and Files, and the Terminal and Code page (when they are on), which ask for it once more before they run anything.</p>
  {{error}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{next}}">
    <label for="password">Password</label>
    <div class="pw-field">
      <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus aria-describedby="{{described}}">
      <button type="button" class="pw-toggle" id="pw-toggle" aria-controls="password" hidden>Show</button>
    </div>
    <button type="submit">Sign in</button>
  </form>
  <p class="hint" id="login-hint">{{forgot}} You stay signed in for {{days}} days.</p>
</main>
</body>
</html>
