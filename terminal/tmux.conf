# tmux for the DevOS ADE terminal: the session ("claude") outlives the browser tab, so a reload, a dropped phone
# connection or a closed tab never ends Claude Code. Ctrl-b c: a new shell window; Ctrl-b n / p: next / previous.
set -g default-shell /bin/bash
set -g default-command "exec bash"   # non-login: /etc/bash.bashrc, then your ~/.bashrc
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 10
set -g history-limit 50000
# Mouse: wheel scrolling and pane/window clicks. A plain drag (or a double or triple click) selects in tmux and, on
# release, copies to the browser's clipboard through OSC 52: ttyd-clipboard.js, in the page, receives it. Shift-drag
# (Option-drag on a Mac) still selects in the page itself, which ttyd copies.
# "external": tmux sends OSC 52 for its own copies only. What a program in a pane prints is dropped (it could
# otherwise replace your clipboard with a command you then paste), and allow-passthrough, off by default, stays off so
# a pane cannot send one around tmux either.
set -g mouse on
set -g set-clipboard external
set -g allow-passthrough off
# Desktop and phone at once: the window follows the device you typed on last.
set -g window-size latest
setw -g aggressive-resize on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#W · Terminal"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# The DevOS colours (the apps' warm Ink, docs/design.md): status bar like the sidebar, the active window in ADE's teal.
set -g status-style "bg=#1a1511,fg=#b3a394"
set -g status-left " #[fg=#f4ecdf,bold]DevOS ADE#[default] "
set -g status-left-length 20
# The key hints only where they fit (a phone needs the room for the window list); the copy hint on the widest.
set -g status-right "#{?#{e|>=:#{client_width},110},Drag to copy · Cmd/Ctrl+V pastes · ,}#{?#{e|>=:#{client_width},72},Ctrl-b c new shell · Ctrl-b n next ,}"
set -g status-right-length 90
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#84c8bf,fg=#14110e,bold] #I #W "
set -g message-style "bg=#84c8bf,fg=#14110e"
set -g mode-style "bg=#84c8bf,fg=#14110e"
set -g pane-active-border-style "fg=#84c8bf"
